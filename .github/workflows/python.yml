name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile scripts
        run: python -m compileall -q scripts/

      - name: Install pytest
        run: python -m pip install --quiet pytest

      - name: Run tests
        run: python -m pytest tests/ -v